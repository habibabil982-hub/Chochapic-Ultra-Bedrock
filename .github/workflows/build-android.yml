
name: Build Android Shader

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Setup compiler
        run: bash build.sh setup

      - name: Compile Android shader
        run: bash build.sh pack -p android -v 46

      - name: Upload shader
        uses: actions/upload-artifact@v4
        with:
          name: Chocapic-Android-Test
          path: build/*.mcpack
          if-no-files-found: error
          
